# Configuration lue par `npx wrangler deploy` lancé à la racine (Cloudflare Workers Builds).
# Même Worker que relay/wrangler.toml, utilisé en local depuis le dossier relay.
name = "wikimasters-tools"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Avance l'index des chaînes de confiance (première lecture en quelques heures, puis mise à jour hebdomadaire).
[triggers]
crons = ["*/30 * * * *"]

# Cache des réponses et index des chaînes de confiance.
[[kv_namespaces]]
binding = "DOC_CACHE"
id = "ceca2f2545544593ab878b40fa43e572"

# Mesure d'usage anonyme (voir docs/superpowers/specs/2026-10-08-monitoring-usage-design.md).
[[d1_databases]]
binding = "USAGE_DB"
database_name = "wikimasters-usage"
database_id = "ebb8d72b-5a66-42da-b26c-7b541f18a838"
migrations_dir = "migrations"
