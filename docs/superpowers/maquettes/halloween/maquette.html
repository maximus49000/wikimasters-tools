<script>
// ═══════════ 01-cel.js ═══════════
// ───────────── outils cellulo (copie de paint/cel.ts, comme le chantier 1) ─────────────
const TAU = Math.PI * 2;

// ───────────── palette (chantier 1 + habitants) ─────────────
const STONES = ['#EDE2C8', '#E8DCC0', '#F0E6D0', '#E4D6BA', '#EAD5B0', '#F2E8D4'];

const ZINCS = ['#8290A2', '#98A4B4', '#7A8AA0'];
const TILES = ['#C86A40', '#B4523A'];

const GLASS_DAY = '#7FB4E0', GLASS_NIGHT = '#232D52', ROOM_DAY = '#4A3C44';

const CURTAINS = ['#F4E6D0', '#C85A3A', '#5A7AA8', '#E8C890', '#8A5A8E'];
const PERSIENNES = ['#C4CCC8', '#B8C0B4', '#CCC4AC'];          // persiennes repliables (haussmann)

const GF = 30, MIN_FLOOR = 10;

// ═══════════ 02-layout.js ═══════════
// ───────────── mise en page des façades (chantier 1, + foyers) ─────────────
// force = { kind, stair, tabatiere } : impose un type pour l'immeuble « héros » (mêmes tirages, déterministe).
function facadeLayout(b, ground, seed, force = {}) {
  const rng = mulberry32(seed ^ hashString('facade') ^ Math.round(b.x * 8));

    : rng() < 0.55 ? { kind: 'zinc', h: 11, zinc: pick(ZINCS, rng) } : { kind: 'tile', h: 12, tile: pick(TILES, rng) };

    const brisisTop = top + roof.terrasson;

const LIT_KEYS = [[0, 0.22], [1, 0.08], [2, 0.03], [4, 0.01], [6, 0.2], [7, 0.45], [8, 0.5], [10, 0.25], [16, 0.25], [18, 0.5], [20, 0.8], [21, 0.85], [22, 0.65], [23, 0.4], [24, 0.22]];

// ───────────── foyers ─────────────
// Types : couple, famille, retraite, etudiant, coloc, solo. Chaque membre = { size, shirt, pants, skin }.
function member(rng, size = 1) { return { size, shirt: pick(SHIRTS, rng), pants: pick(PANTS, rng), skin: pick(SKINS, rng) }; }

  const r = rng();
  let type = r < 0.25 ? 'couple' : r < 0.45 ? 'famille' : r < 0.63 ? 'retraite' : r < 0.75 ? 'etudiant' : r < 0.85 ? 'coloc' : 'solo';
  if (home.bays.length === 1 && (type === 'famille' || type === 'coloc')) type = 'etudiant';

}
function makeHousehold(type, rng) {

  else if (type === 'famille') { members.push(member(rng), member(rng), member(rng, 0.62)); if (rng() < 0.5) members.push(member(rng, 0.7)); }
  else if (type === 'retraite') { members.push(member(rng, 0.94)); if (rng() < 0.6) members.push(member(rng, 0.94)); }
  else if (type === 'etudiant') members.push(member(rng, 0.97));
  else if (type === 'coloc') { members.push(member(rng), member(rng)); if (rng() < 0.6) members.push(member(rng)); }

}

// ═══════════ 03-temps.js ═══════════
// ───────────── temps, soleil, ambiance ─────────────
// Lever / coucher à Paris (heure locale, DST comprise), par mois.
const SUNS = [[8.7, 17.3], [8.1, 18.2], [7.2, 19.0], [7.1, 20.7], [6.3, 21.4], [5.8, 21.9], [6.1, 21.8], [6.8, 21.1], [7.5, 20.1], [8.2, 19.0], [8.0, 17.3], [8.6, 16.9]];

// D = contexte du jour : { date, month, weekday (0 dim..6 sam), weekend, event, couvreur }
function dayContext(dateStr, event) {

  const month = d.getMonth() + 1, weekday = d.getDay(), md = dateStr.slice(5);

}

}
const isNight = () => ENV.dark > 0.2;
const fmtT = (T) => { const h = Math.floor(T) % 24, m = Math.floor((T - Math.floor(T)) * 60); return `${h}h${String(m).padStart(2, '0')}`; };

// Ciel : fondu nuit / jour / crépuscule, étoiles, lune, soleil, feux d'artifice.
const SKY = { night: ['#0A1038', '#1A2A66', '#34488C'], day: ['#3F8BE0', '#8EC3F0', '#DCEFF8'], dusk: ['#5E4E9C', '#D86C7A', '#FFD88C'], dawn: ['#3A4A8C', '#C88AA0', '#FFE0A8'] };

}
// Feux d'artifice (14 juillet 22 h 25 → 23 h ; Nouvel An 0 h 00 → 0 h 20) : une gerbe toutes les 2,5 s, vie 2,4 s, fonction pure de T.
function fireworksActive(T, D) { return (D.event === 'feux' && T >= 22 + 25 * MIN && T <= 23) || (D.event === 'nouvel-an' && T >= 0 && T <= 20 * MIN); }

// Borne d'animation : au plus MAX_ANIM fenêtres animées à la fois (les poses fixes ne comptent pas) ; priorité puis proximité du centre.
const MAX_ANIM = 8;
function cullAnimated(facades, states, W) {
  const all = [];
  facades.forEach((f, fi) => f.homes.forEach((hm, hi) => { const st = states[fi][hi]; if (!st) return; st.actors.forEach((a) => { if (a.animated) all.push({ a, prio: a.prio, d: Math.abs(f.bayX(hm.bays[0]) - W / 2) }); }); }));
  all.sort((p, q) => q.prio - p.prio || p.d - q.d);
  all.forEach((e, i) => { if (i >= MAX_ANIM) e.a.culled = true; });
  return { animated: all.length, shown: Math.min(all.length, MAX_ANIM) };
}

const POSE = {

  armsUp: { torso: -4, head: -10, aL: [150, -18], aR: [150, -18], lL: [5, 0], lR: [5, 0] },
  reach: { torso: 5, head: -4, aL: [100, -30], aR: [22, 10], lL: [4, 0], lR: [4, 0] },
  lean: { torso: 26, head: -16, aL: [58, -80], aR: [58, -80], lL: [2, 0], lR: [2, 0] },
  leanRail: { torso: 16, head: -8, aL: [32, -42], aR: [32, -42], lL: [4, 0], lR: [4, 0] },
  smokeUp: { torso: 2, head: 6, aL: [8, 10], aR: [24, -142], lL: [4, 0], lR: [4, 0] },
  smokeDown: { torso: 2, head: -6, aL: [8, 10], aR: [16, -28], lL: [4, 0], lR: [4, 0] },
  water: { torso: 30, head: -6, aL: [-14, 16], aR: [74, -14], lL: [10, 0], lR: [-6, 0] },
  shake: { torso: 20, head: -8, aL: [88, -14], aR: [88, -14], lL: [4, 0], lR: [4, 0] },
  curtain: { torso: 2, head: 8, aL: [10, 8], aR: [116, -16], lL: [4, 0], lR: [4, 0] },
  sitTable: { torso: -4, head: 12, aL: [64, -88], aR: [64, -88], lL: [88, -88], lR: [88, -88] },
  sitTv: { torso: -16, head: 8, aL: [24, -48], aR: [24, -48], lL: [78, -70], lR: [84, -74] },
  cook: { torso: 8, head: 16, aL: [40, -64], aR: [54, -80], lL: [4, 0], lR: [4, 0] },
  kneel: { torso: 34, head: 10, aL: [60, -40], aR: [80, -60], lL: [90, -140], lR: [60, -120] },

const d2r = Math.PI / 180;
const mixPose = (A, B, t) => ({ torso: lerp(A.torso, B.torso, t), head: lerp(A.head, B.head, t), aL: [lerp(A.aL[0], B.aL[0], t), lerp(A.aL[1], B.aL[1], t)], aR: [lerp(A.aR[0], B.aR[0], t), lerp(A.aR[1], B.aR[1], t)], lL: [lerp(A.lL[0], B.lL[0], t), lerp(A.lL[1], B.lL[1], t)], lR: [lerp(A.lR[0], B.lR[0], t), lerp(A.lR[1], B.lR[1], t)], dy: lerp(A.dy || 0, B.dy || 0, t) });

// Cinématique : hanche au-dessus du pied le plus bas ; renvoie les articulations (repère local, pieds en (0,0), y vers le bas).

}
// Tracé : silhouette (une couleur) ou pantin couleur (passe encre épaisse puis couleurs, membre arrière plus sombre).
function drawFigure(ctx, fx, fy, h, P, facing, style) {

    const back = facing !== 0;   // de profil : le membre gauche est derrière
    const limbs = [['leg', [J.hip, J.kL, J.fL], pants, back], ['arm', [J.sh, J.eL, J.hL], shirt, back], ['leg', [J.hip, J.kR, J.fR], pants, false], ['arm', [J.sh, J.eR, J.hR], shirt, false]];

    line([J.hip, J.neck], inkC, lw * 2.2 + 0.07 * h);
    dot(J.head, J.headR + 0.035 * h, inkC);
    for (const [, pts, c, isBack] of limbs) line(pts, isBack ? rgba(shade(hex(c), 0.35)) : c, lw);
    line([J.hip, J.neck], shirt, lw * 2.2); line([J.hip, [J.hip[0] * 0.5 + J.neck[0] * 0.5, J.hip[1] * 0.5 + J.neck[1] * 0.5]], pants, lw * 2.0);
    dot(J.head, J.headR, skin); dot([J.head[0] - J.headR * 0.1, J.head[1] - J.headR * 0.45], J.headR * 0.72, style.hair || '#3A2A28');

}
// Chorégraphies : p ∈ [0,1] → { P, dx (en largeurs de fenêtre, 0 = centré), facing, where?, props, still? }.
// Entrée / sortie : toute scène « in » commence en marchant depuis la pièce voisine et finit en repartant (rien n'apparaît sur place).
function choreo(seg, p, T, home) {
  const dur = seg.t1 - seg.t0, tIn = Math.min(0.3, 11 * SEC / dur), tOut = Math.min(0.3, 11 * SEC / dur);

  if (name === 'tv') { const side = (seg.seat || 0) % 2 ? -1 : 1; if (p < tIn) return walkIn(p / tIn, -1.4, 0.22 * side); if (p > 1 - tOut) return walkIn((p - 1 + tOut) / tOut, 0.22 * side, 1.4); return { P: POSE.sitTv, dx: 0.22 + (seg.seat || 0) * 0.16, facing: -1, props: [{ type: 'tv', dx: -0.34 }], still: true }; }
  if (name === 'table') { const i = seg.seat || 0, n = seg.party || 2, side = i % 2 ? 1 : -1; const dx = n === 1 ? (seg.desk ? -0.12 : -0.2) : side * (0.24 + Math.floor(i / 2) * 0.1); const fac = n === 1 ? 1 : -side; if (p < tIn) return walkIn(p / tIn, -1.4, dx); if (p > 1 - tOut) return walkIn((p - 1 + tOut) / tOut, dx, 1.4); const stir = Math.sin(s / 1.7 + i) * 4; return { P: mixPose(POSE.sitTable, { ...POSE.sitTable, aR: [64 + stir, -88 - stir] }, 0.5), dx, facing: fac, props: i === 0 ? [{ type: seg.desk ? 'desk' : 'table', n }] : [], still: true }; }

  if (name === 'armsUp') { if (p < 0.2) return walkIn(p / 0.2, -1.5, 0); if (p > 0.8) return walkIn((p - 0.8) / 0.2, 0, 1.5); return { P: mixPose(POSE.stand, POSE.armsUp, smooth(sat((p - 0.2) / 0.1)) * smooth(sat((0.8 - p) / 0.1))), dx: 0, facing: 0 }; }
  if (name === 'stand') { if (p < tIn) return walkIn(p / tIn, -1.4, 0.1); if (p > 1 - tOut) return walkIn((p - 1 + tOut) / tOut, 0.1, 1.4); return { P: POSE.stand, dx: 0.1 + Math.sin(s / 7) * 0.1, facing: 0, still: true }; }
  if (name === 'openShutters') {
    if (p < 0.12) return walkIn(p / 0.12, -1.5, 0);
    if (p < 0.26) return { P: mixPose(POSE.stand, POSE.armsUp, smooth((p - 0.12) / 0.14)), dx: 0, facing: 0 };
    if (p < 0.6) return { P: { ...POSE.armsUp, aL: [150 - (p - 0.26) * 60, -18], aR: [150 - (p - 0.26) * 60, -18] }, dx: 0, facing: 0 };
    if (p < 0.72) return { P: mixPose(POSE.armsUp, POSE.reach, smooth((p - 0.6) / 0.12)), dx: 0, facing: 0 };
    if (p < 0.9) return { P: mixPose(POSE.reach, POSE.lean, smooth((p - 0.72) / 0.06)), dx: 0, facing: 0, where: 'lean' };
    return walkIn((p - 0.9) / 0.1, 0, 1.5);
  }
  if (name === 'closeShutters') {
    if (p < 0.14) return walkIn(p / 0.14, 1.5, 0);
    if (p < 0.3) return { P: mixPose(POSE.stand, POSE.reach, smooth((p - 0.14) / 0.16)), dx: 0, facing: 0 };
    if (p < 0.45) return { P: mixPose(POSE.reach, POSE.armsUp, smooth((p - 0.3) / 0.15)), dx: 0, facing: 0 };
    if (p < 0.82) return { P: { ...POSE.armsUp, aL: [120 + (p - 0.45) * 40, -18], aR: [120 + (p - 0.45) * 40, -18] }, dx: 0, facing: 0 };

  if (name === 'leanRail') { const out = bal ? balconyInOut(p, tIn, tOut, slot) : null; if (out) return out; return { P: { ...POSE.leanRail, head: -8 + Math.sin(s / 6 + slot) * 10 }, dx: bal ? 0.3 + slot * 0.55 : 0, facing: 0, where: bal ? 'balcony' : 'lean', still: true }; }
  if (name === 'smoke') {
    const out = bal ? balconyInOut(p, tIn, tOut, slot) : null; if (out) return out;
    if (!bal && p < tIn) return walkIn(p / tIn, -1.5, 0); if (!bal && p > 1 - tOut) return walkIn((p - 1 + tOut) / tOut, 0, 1.5);
    const cyc = (s / 11 + slot) % 1, up = cyc < 0.3 ? smooth(sat(cyc / 0.08)) * smooth(sat((0.3 - cyc) / 0.08)) : 0;
    return { P: mixPose(bal ? POSE.smokeDown : { ...POSE.smokeDown, torso: 18, aL: [50, -75] }, POSE.smokeUp, up), dx: bal ? 0.3 + slot * 0.55 : 0, facing: 0, where: bal ? 'balcony' : 'lean', props: [{ type: 'ember', puff: cyc > 0.3 && cyc < 0.6 ? (cyc - 0.3) / 0.3 : -1 }] };
  }
  if (name === 'water') {
    const out = bal ? balconyInOut(p, tIn, tOut, 0) : null; if (out) return out;
    if (!bal && p < tIn) return walkIn(p / tIn, -1.5, 0); if (!bal && p > 1 - tOut) return walkIn((p - 1 + tOut) / tOut, 0, 1.5);
    const q = (p - tIn) / (1 - tIn - tOut), pot = Math.floor(q * 3), ph = (q * 3) % 1, pour = ph > 0.25 && ph < 0.8;

  }

  if (name === 'dance') { if (p < tIn) return walkIn(p / tIn, -1.5, -0.4 + slot * 0.3); if (p > 1 - tOut) return walkIn((p - 1 + tOut) / tOut, -0.4 + slot * 0.3, 1.5); return { P: dancePose(s / 1.1 + slot * 0.3), dx: -0.4 + slot * 0.3 + Math.sin(s / 2.3 + slot) * 0.08, facing: 0 }; }
  return { P: POSE.stand, dx: 0, facing: 0 };
}
// Sortie sur le balcon par la porte-fenêtre : on traverse le plan de la vitre (dedans → dehors), et retour en fin de scène.
function balconyInOut(p, tIn, tOut, slot) {
  const target = 0.3 + slot * 0.55;
  if (p < tIn * 0.55) return { P: walkPose(p * 400), dx: lerp(-1.5, 0.05, p / (tIn * 0.55)), facing: 1, where: 'in' };
  if (p < tIn) return { P: walkPose(p * 400), dx: lerp(0.05, target, (p - tIn * 0.55) / (tIn * 0.45)), facing: 1, where: 'balcony' };
  if (p > 1 - tOut * 0.45) return { P: walkPose(p * 400), dx: lerp(0.05, -1.5, (p - 1 + tOut * 0.45) / (tOut * 0.45)), facing: -1, where: 'in' };
  if (p > 1 - tOut) return { P: walkPose(p * 400), dx: lerp(target, 0.05, (p - 1 + tOut) / (tOut * 0.55)), facing: -1, where: 'balcony' };
  return null;
}

// ═══════════ 07a-facade.js ═══════════
// ───────────── peinture d'une façade (chantier 1 + états vivants) ─────────────
// ctxScene = { T, D, W, states: état par logement (même index que f.homes), street: streetEvents(f) }
function paintFacade(ctx, f, sc, opts = {}) {
  const { x, w, top, eave, ground, wall, levels } = f;
  const h = ground - eave;
  fillRect(ctx, wall, x, eave, w, h);
  fillRect(ctx, shade(hex(wall), 0.28), x + w * 0.74, eave, w * 0.26, h);
  fillRect(ctx, light(hex(wall), 0.45), x, eave, 1.4, h);
  fillRect(ctx, shade(hex(wall), 0.18), x, ground - 3, w, 3);
  if (f.kind === 'haussmann') { ctx.strokeStyle = rgba(amb(shade(hex(wall), 0.22)), 0.9); ctx.lineWidth = 0.4; ctx.beginPath(); for (let yy = eave + 6; yy < ground - GF - 2; yy += 4.5) { ctx.moveTo(x, yy); ctx.lineTo(x + w, yy); } ctx.stroke(); }
  for (const lv of levels) { if (lv.level === 'entresol') continue; const by = lv.y + lv.h; fillRect(ctx, light(hex(wall), 0.5), x, by - 1.2, w, 1.2); fillRect(ctx, shade(hex(wall), 0.38), x, by, w, 0.9); }
  fillRect(ctx, shade(hex(wall), 0.3), x, ground - GF - 1, w, 1);
  paintGroundFloor(ctx, f, sc);
  paintHwDoor(ctx, f, sc);                                        // Halloween : toile ou fantôme sur la porte
  const leaners = [];
  for (const win of f.windows) paintWindow(ctx, f, win, sc, leaners);
  for (const L of leaners) L();                                   // penchés : devant l'appui, après toutes les fenêtres
  paintHwBalconies(ctx, f, sc, 'back');                           // Halloween : derrière les garde-corps
  for (const lv of levels) if (lv.balcony === 'filant') paintBalcony(ctx, f, x + 1.5, lv.y + lv.h, w - 3, lv, true, sc);
  for (const win of f.windows) if (win.level.balcony === 'balconnet' && win.kind === 'std') paintBalcony(ctx, f, win.x - 1.2, win.y + win.h, win.w + 2.4, win.level, false, sc);
  paintHwBalconies(ctx, f, sc, 'front');                          // Halloween : sur les garde-corps
  fillRect(ctx, light(hex(wall), 0.5), x - 1.5, eave - 0.8, w + 3, 3);
  fillRect(ctx, shade(hex(wall), 0.42), x, eave + 2.2, w, 2.6);
  inkRect(ctx, x - 1.5, eave - 0.8, w + 3, 3, 0.7);
  paintRoof(ctx, f, sc);
  inkRect(ctx, x, eave, w, h, 0.9);
  if (opts.leftTouch) inkLine(ctx, [[x, Math.max(top, opts.leftTouch)], [x, ground]], 1.3);

// Porte ouverte et hall éclairé pendant les allers et retours à la porte.
function hwStreetEvents(f, T, D, ev) {
  if (!f.hwItems) return ev;
  const A = hwDay(D.date) * 24 + T;
  for (const it of f.hwItems) {
    if (it.gesture !== 'door' && it.gesture !== 'cauldron') continue;
    const ph = hwPhase(it, A); if (!ph || ph.k === 'on') continue;
    const q = it.gesture === 'door' ? 0.08 : 0.12;
    const o = ph.p < q + 0.04 ? sat(1 - Math.abs(ph.p - q / 2) / (q * 0.9)) : ph.p > 1 - q - 0.04 ? sat(1 - Math.abs(ph.p - (1 - q / 2)) / (q * 0.9)) : 0;
    ev.door = Math.max(ev.door, o);

  return ev;
}

// ───────────── lampadaires : décor de la mairie, posé au camion-nacelle ─────────────
// Même mécanique que les drapeaux (install.ts) : un élément par lampadaire, traité un par un dans l'ordre de `u` ; pose le
// samedi 24 octobre de 9 h à 17 h, retrait le mardi 3 novembre de 9 h à 17 h. Étapes : arrive, deploy, rise, fix, lower,
// stow, leave (poids 3, 2, 2, 6, 2, 2, 3) ; l'élément apparaît à la fin de `fix` et disparaît à la fin de `unfix`.
const HW_LAMP_XS = [110, 370, 630, 890];
const HW_LIFT_STEPS = ['arrive', 'deploy', 'rise', 'fix', 'lower', 'stow', 'leave'], HW_LIFT_W = [3, 2, 2, 6, 2, 2, 3];
function hwLampSet() {
  const r = mulberry32(SEED ^ hashString('hw-lamps' + HW_YEAR));
  const items = HW_LAMP_XS.map((x, i) => ({ x, kind: r() < 0.55 ? 'lantern' : 'bats', u: r(), removeU: r(), v: r(), i }));
  const n = items.length, slot = (key, it, day) => { const k = [...items].sort((a, b) => a[key] - b[key]).indexOf(it); return { from: day * 24 + 9 + (k * 8) / n, to: day * 24 + 9 + ((k + 1) * 8) / n }; };
  for (const it of items) { it.ins = slot('u', it, OCT(24)); it.out = slot('removeU', it, NOV(3)); }
  return items;
}
function hwLiftStep(slot, A) {
  const tot = HW_LIFT_W.reduce((s, x) => s + x, 0); let at = slot.from;
  for (let i = 0; i < HW_LIFT_STEPS.length; i++) { const to = at + ((slot.to - slot.from) * HW_LIFT_W[i]) / tot; if (A < to) return { i, step: HW_LIFT_STEPS[i], p: (A - at) / (to - at) }; at = to; }
  return null;
}
function hwLampState(it, A) {
  if (A < it.ins.from) return { shown: false };
  if (A < it.ins.to) { const s = hwLiftStep(it.ins, A); return { shown: s.i > 3, crew: s, removing: false }; }
  if (A < it.out.from) return { shown: true };
  if (A < it.out.to) { const s = hwLiftStep(it.out, A); return { shown: s.i <= 3, crew: s, removing: true }; }
  return { shown: false };
}
function paintHwLamps(ctx, T, D) {
  const street = buildStreet(D); if (!street.hwLamps) return;
  const A = hwDay(D.date) * 24 + T, night = isNight();
  for (const it of street.hwLamps) {
    const st = hwLampState(it, A);
    if (st.shown) paintLampDecor(ctx, it, T, night);
    if (st.crew) paintLiftTruck(ctx, it, st, T, night);
  }
}
function paintLampDecor(ctx, it, T, lit) {
  const lx = it.x;
  if (it.kind === 'lantern') {
    inkLine(ctx, [[lx, GROUND - 27], [lx - 5.5, GROUND - 27], [lx - 5.5, GROUND - 25.5]], 0.5);
    paintPumpkin(ctx, lx - 5.5, GROUND - 21.3, 2.2, it.v, lit);
  } else {
    // guirlande de chauves-souris en papier : deux festons depuis la lanterne
    ctx.strokeStyle = col('#8A5A8E'); ctx.lineWidth = 0.35;
    const fest = (x0, y0, x1, y1, sag) => { ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo((x0 + x1) / 2, (y0 + y1) / 2 + sag, x1, y1); ctx.stroke(); };
    fest(lx - 1, GROUND - 31, lx - 1, GROUND - 16, 0); fest(lx + 0.8, GROUND - 31, lx + 9, GROUND - 24, 4); fest(lx - 0.8, GROUND - 31, lx - 9, GROUND - 24, 4);
    const bat = (x, y, s, ph) => { const fl = Math.sin(T / SEC * 2 + ph) * 0.3; ctx.fillStyle = rgba(amb(hex('#22182A'))); ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x - s * 0.6, y - s * (0.6 + fl), x - s * 1.4, y - s * 0.2); ctx.quadraticCurveTo(x - s * 0.9, y + s * 0.1, x - s * 0.7, y + s * 0.4); ctx.quadraticCurveTo(x - s * 0.3, y + s * 0.1, x, y + s * 0.4); ctx.quadraticCurveTo(x + s * 0.3, y + s * 0.1, x + s * 0.7, y + s * 0.4); ctx.quadraticCurveTo(x + s * 0.9, y + s * 0.1, x + s * 1.4, y - s * 0.2); ctx.quadraticCurveTo(x + s * 0.6, y - s * (0.6 + fl), x, y); ctx.fill(); if (lit) { disc(ctx, '#FFB040', x - s * 0.15, y + s * 0.05, 0.18, true); disc(ctx, '#FFB040', x + s * 0.15, y + s * 0.05, 0.18, true); } };
    [[-5, -25.6], [-8, -23.2], [5, -25.6], [8, -23.2], [0, -20], [0, -17.5]].forEach(([dx, dy], k) => bat(lx + dx, GROUND + dy, 1.5, k));

}
// Camion-nacelle garé contre le trottoir sous le lampadaire (cabine vers la droite, sens de la file du premier plan).
function paintLiftTruck(ctx, it, st, T, night) {
  const { step, p } = st.crew, park = it.x - 33, wy = GROUND + 36;
  let tx = park;
  if (step === 'arrive') tx = lerp(-60, park, smooth(Math.min(1, p * 1.25)));
  else if (step === 'leave') tx = lerp(park, W + 60, smooth(sat((p - 0.2) * 1.25)));

  const up = step === 'rise' ? smooth(p) : step === 'fix' ? 1 : step === 'lower' ? 1 - smooth(p) : 0;
  const pivot = [tx - 6, wy - 13], rest = [tx - 20, wy - 13], target = [it.x - 9, GROUND - 26];
  const bucket = [lerp(rest[0], target[0], up), lerp(rest[1], target[1], up)];
  const L = 32, dx = bucket[0] - pivot[0], dy = bucket[1] - pivot[1], dd = Math.min(2 * L - 0.1, Math.hypot(dx, dy)), a = Math.atan2(dy, dx), b = Math.acos(dd / (2 * L));

  if (legs > 0) for (const lx of [tx - 18, tx + 6]) { fillRect(ctx, '#3A3A40', lx - 0.5, wy - 6, 1, 4 + legs * 3); fillRect(ctx, '#3A3A40', lx - 1.8, wy - 2 + legs * 3, 3.6, 0.8); }
  // carrosserie
  fillRect(ctx, '#F2F0E8', tx - 24, wy - 11, 34, 7); fillRect(ctx, '#E8B830', tx - 24, wy - 6, 34, 1.4); inkRect(ctx, tx - 24, wy - 11, 34, 7, 0.6);
  fillRect(ctx, '#F2F0E8', tx + 10, wy - 17, 12, 13); fillRect(ctx, '#BBD8F0', tx + 13, wy - 15.5, 8, 5); inkRect(ctx, tx + 10, wy - 17, 12, 13, 0.6);
  ctx.fillStyle = INK; ctx.font = 'bold 2.4px sans-serif'; ctx.fillText('VILLE', tx - 20, wy - 7.4);
  if (night || step !== 'fix') { disc(ctx, '#FFB040', tx + 16, wy - 18, 0.9, true); if (night) { ctx.fillStyle = 'rgba(255,176,64,0.3)'; ctx.beginPath(); ctx.arc(tx + 16, wy - 18, 2.6, 0, TAU); ctx.fill(); } }
  disc(ctx, '#2A2A2A', tx - 15, wy - 2.5, 3); disc(ctx, '#2A2A2A', tx + 15, wy - 2.5, 3); disc(ctx, '#8A8A90', tx - 15, wy - 2.5, 1.1); disc(ctx, '#8A8A90', tx + 15, wy - 2.5, 1.1);
  // caisse de décors sur le plateau
  fillRect(ctx, '#B8885A', tx - 2, wy - 15, 9, 4); inkRect(ctx, tx - 2, wy - 15, 9, 4, 0.4);
  ctx.strokeStyle = '#E8B830'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(pivot[0], pivot[1]); if (folded) ctx.lineTo(rest[0], rest[1]); else { ctx.lineTo(elbow[0], elbow[1]); ctx.lineTo(bucket[0], bucket[1]); } ctx.stroke();
  ctx.strokeStyle = INK; ctx.lineWidth = 0.35; ctx.stroke(); ctx.lineCap = 'butt';
  disc(ctx, '#5A5A60', pivot[0], pivot[1], 1.4); if (!folded) disc(ctx, '#5A5A60', elbow[0], elbow[1], 1.1);
  // ouvrier : en cabine pendant les trajets, dans la nacelle de « deploy » à « stow » (il y monte depuis la cabine)
  const inBucket = (step === 'deploy' && p > 0.5) || step === 'rise' || step === 'fix' || step === 'lower' || (step === 'stow' && p < 0.5);
  const mem = { size: 1, shirt: '#E8772E', pants: '#2E3A4A', skin: '#D9A070' };
  if (inBucket) {
    const working = step === 'fix', P = working ? { ...POSE.armsUp, aL: [146, -10], aR: [128 + Math.sin(T / SEC * 3) * 10, -20], torso: 4 } : POSE.stand;
    const J = drawFigure(ctx, bucket[0], bucket[1], 12, P, 1, { mem, amb: true });
    // l'objet : pris dans la caisse au déploiement, tenu jusqu'à la fin de la fixation (à la dépose, l'inverse)
    const holding = st.removing ? step === 'lower' || (step === 'stow' && p < 0.5) || (working && p > 0.85) : step === 'rise' || (step === 'deploy' && p > 0.5) || (working && p < 0.7);
    if (holding) { if (it.kind === 'lantern') paintPumpkin(ctx, bucket[0] + J.hR[0] + 1, bucket[1] + J.hR[1] + 2, 1.8, it.v, false); else { ctx.fillStyle = col('#22182A'); ctx.fillRect(bucket[0] + J.hR[0], bucket[1] + J.hR[1], 2.6, 1.6); } }
  } else if (step === 'deploy' || step === 'stow') {
    const q = step === 'deploy' ? p / 0.5 : (1 - p) / 0.5, x = lerp(tx + 12, tx - 18, sat(q));
    ctx.globalAlpha = sat(q * 4); drawFigure(ctx, x, wy - 1, 12, walkPose(T / SEC / 0.9), -1, { mem, amb: true }); ctx.globalAlpha = 1;
  }

  fillRect(ctx, '#F4F4F0', bucket[0] - 4, bucket[1] - 4.5, 8, 5); fillRect(ctx, '#E8B830', bucket[0] - 4, bucket[1] - 4.5, 8, 1); inkRect(ctx, bucket[0] - 4, bucket[1] - 4.5, 8, 5, 0.45);
}

// ───────────── planche des décors (×4, jour / nuit) ─────────────

    ['Citrouille (4 visages)', (ctx, T, lit) => { [0.11, 0.37, 0.58, 0.83].forEach((v, k) => paintPumpkin(ctx, -15 + k * 10, 8, 3.4, v, lit)); }],
    ['Toile d’araignée (porte)', (ctx, T, lit) => { fillRect(ctx, '#5A3A2E', -8, -14, 16, 22); paintWeb(ctx, -8, -14, 11, 1, lit); paintWeb(ctx, 8, -14, 7, -1, lit); }],

    ['Lanterne citrouille (lampadaire)', (ctx, T, lit) => { ctx.save(); ctx.translate(-110 + 4, -GROUND + 12); paintLampDecor(ctx, { x: 110, kind: 'lantern', v: 0.37 }, T, lit); ctx.restore(); }],

// Vue rapprochée sur le lampadaire en cours de travail à l'heure T (camion-nacelle).

  { id: 'habitants-24oct-15h05', T: 15 + 5.5 * MIN, date: '2026-10-24', note: 'samedi 24 oct. 15 h 05 — premiers habitants : toile sur la porte (escabeau), citrouilles' },

  { id: 'nuit-1nov-0h50', T: 50 * MIN, date: '2026-11-01', note: 'dimanche 1er nov. 0 h 50 — pièces éteintes, des citrouilles encore allumées' },

  { id: 'retrait-3nov-11h', T: 11 + 0.2 * MIN, date: '2026-11-03', zoom: 'hero', note: 'mardi 3 nov. 11 h — retrait étalé : la mairie décroche, un habitant reprend sa toile' },
