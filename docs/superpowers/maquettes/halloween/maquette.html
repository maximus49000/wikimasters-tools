<script>

// ───────────── palette (chantier 1 + habitants) ─────────────
const STONES = ['#EDE2C8', '#E8DCC0', '#F0E6D0', '#E4D6BA', '#EAD5B0', '#F2E8D4'];

const ZINCS = ['#8290A2', '#98A4B4', '#7A8AA0'];
const TILES = ['#C86A40', '#B4523A'];

const GLASS_DAY = '#7FB4E0', GLASS_NIGHT = '#232D52', ROOM_DAY = '#4A3C44';

const CURTAINS = ['#F4E6D0', '#C85A3A', '#5A7AA8', '#E8C890', '#8A5A8E'];

const GF = 30, MIN_FLOOR = 10;

// ═══════════ 02-layout.js ═══════════
// ───────────── mise en page des façades (chantier 1, + foyers) ─────────────

// ───────────── foyers ─────────────
// Types : couple, famille, retraite, etudiant, coloc, solo. Chaque membre = { size, shirt, pants, skin }.
function member(rng, size = 1) { return { size, shirt: pick(SHIRTS, rng), pants: pick(PANTS, rng), skin: pick(SKINS, rng) }; }

  const r = rng();

}
function makeHousehold(type, rng) {

}

// ═══════════ 03-temps.js ═══════════
// ───────────── temps, soleil, ambiance ─────────────
// Lever / coucher à Paris (heure locale, DST comprise), par mois.
const SUNS = [[8.7, 17.3], [8.1, 18.2], [7.2, 19.0], [7.1, 20.7], [6.3, 21.4], [5.8, 21.9], [6.1, 21.8], [6.8, 21.1], [7.5, 20.1], [8.2, 19.0], [8.0, 17.3], [8.6, 16.9]];
// Après le passage à l'heure d'hiver (dernier dimanche d'octobre), le soleil se couche vers 17 h 22 à Paris.

function dayContext(dateStr, event) {

}
const isNight = () => ENV.dark > 0.2;
const fmtT = (T) => { const h = Math.floor(T) % 24, m = Math.floor((T - Math.floor(T)) * 60); return `${h}h${String(m).padStart(2, '0')}`; };

// Ciel : fondu nuit / jour / crépuscule, étoiles, lune, soleil, feux d'artifice.
const SKY = { night: ['#0A1038', '#1A2A66', '#34488C'], day: ['#3F8BE0', '#8EC3F0', '#DCEFF8'], dusk: ['#5E4E9C', '#D86C7A', '#FFD88C'], dawn: ['#3A4A8C', '#C88AA0', '#FFE0A8'] };

// Feux d'artifice (14 juillet 22 h 25 → 23 h ; Nouvel An 0 h 00 → 0 h 20) : une gerbe toutes les 2,5 s, vie 2,4 s, fonction pure de T.

function n31PaintDog(ctx, x, fy, pose, t, sillY) {

}
